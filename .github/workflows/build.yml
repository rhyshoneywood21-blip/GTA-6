name: Build GTA 6 Ultimate Companion
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate data and build assets
        run: |
          node scripts/check-data.mjs
          node scripts/build-assets.mjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Run mobile-browser tests
        run: node scripts/browser-test.mjs
      - name: Verify live interactive map
        run: node scripts/live-map-test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Verify required Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle -p android :app:assembleDebug
      - name: Upload installable debug build
        uses: actions/upload-artifact@v4
        with:
          name: Leonida-Companion-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload standalone browser edition and import report
        uses: actions/upload-artifact@v4
        with:
          name: Leonida-Companion-Web
          path: |
            dist/Leonida-Companion.html
          if-no-files-found: error
